[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sims-reader"
version = "0.1.0"
description = "Provisional reader for an observed Cameca 7f-GEO image layout"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.4.4"]

[project.scripts]
sims-reader = "sims_reader.cli:main"

[project.optional-dependencies]
zarr = [
    "zarr==3.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sims_reader = ["py.typed"]
